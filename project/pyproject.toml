[project]
name = "vellric"
version = "0.2.0"
description = "Independent local PDF inspection, fidelity conversion, rendering and OCR."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSES/*.txt", "NOTICE"]
readme = "README.md"
authors = [{ name = "Wolf McNally" }]
dependencies = ["pymupdf==1.28.2", "pillow==12.3.0"]

[project.optional-dependencies]
ocr = ["ocrmypdf==17.7.0"]
vision = ["anthropic==1.12.0"]

[project.scripts]
vellric = "vellric.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vellric"]

[dependency-groups]
dev = ["pyyaml>=6.0,<7", "pytest>=8.0", "ruff>=0.6", "anthropic==1.12.0"]

[tool.uv]
required-version = ">=0.9.26"
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.sdist]
include = ["vellric", "docs", "tests", "pyproject.toml", "README.md", "LICENSE", "LICENSES", "NOTICE", "uv.lock", ".python-version", "build-constraints.txt"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "vellric/docs"
