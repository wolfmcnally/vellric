name: Windows
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing immutable release tag to qualify/backfill (empty uses event source)
        required: false
        type: string
        default: ""
      candidate_sha:
        description: Full untagged commit ID of the dispatched workflow commit to qualify as a candidate ZIP; never a release asset
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  tests:
    name: Tests without OCR engines, Python ${{ matrix.python }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.9.26"
      - name: Provision the locked project
        run: uv sync --locked --project project --python ${{ matrix.python }}
      - name: Run the project tests
        working-directory: project
        # The tests read and write UTF-8; the tool they start runs in the system's own mode.
        run: uv run --no-sync python -X utf8 -m pytest -q
  bundle:
    name: Bundle, OCR engines and fixture conversion
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
    env:
      RELEASE_REF: ${{ inputs.release_ref || github.event.release.tag_name || '' }}
      CANDIDATE: ${{ inputs.candidate_sha || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          ref: ${{ inputs.release_ref || github.sha }}
          fetch-depth: 0 # The exact source tag and immutable project content are checked.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: release-tools
          ref: ${{ github.sha }}
      - name: Verify requested source tag
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_REF) {
            if ($env:RELEASE_REF -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'An existing release tag is required' }
            $tag = git rev-parse "refs/tags/$env:RELEASE_REF"
            $head = git rev-parse HEAD
            if ($tag -ne $head) { throw 'Checkout differs from requested release tag' }
          }
          if ($env:CANDIDATE) {
            # A candidate is the exact commit this workflow and its tooling run from, and its
            # version must not be tagged anywhere yet.
            if ($env:RELEASE_REF) { throw 'A candidate run takes no release tag' }
            if ($env:CANDIDATE -cnotmatch '^[0-9a-f]{40}$') { throw 'A candidate is a full lowercase commit ID' }
            if ((git rev-parse HEAD) -ne $env:CANDIDATE -or $env:GITHUB_SHA -ne $env:CANDIDATE) { throw 'Candidate differs from the checkout or the workflow commit' }
            $version = (Select-String -Path project\pyproject.toml -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"$' | Select-Object -First 1).Matches.Groups[1].Value
            if (-not $version) { throw 'The project version could not be read' }
            # Both lookups must succeed: any listed ref is the tag, and a git failure stops the
            # step. No lookup leaves a nonzero exit code for the step's own exit status.
            $localTag = git for-each-ref "refs/tags/v$version"
            $remoteTag = git ls-remote --tags origin "refs/tags/v$version"
            if ($localTag -or $remoteTag) { throw "v$version is already tagged" }
            "CANDIDATE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.9.26"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Build the bundle
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory measured | Out-Null
          python project/packaging/windows_bundle.py --out dist | Tee-Object measured\bundle-contents.txt
      - name: Rebuild the exact Vellric source archive
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Build from the committed blobs: a checkout with no line-ending conversion, so the
          # fixed-epoch archive is the same bytes on every platform. The release assembly's fetch
          # accepts it only at the closure's pinned digest.
          $clean = "$env:RUNNER_TEMP\vellric-source"
          git clone --quiet --no-local --no-checkout --config core.autocrlf=false --config core.eol=lf . $clean
          git -C $clean checkout --quiet --detach (git rev-parse HEAD)
          $converted = @(git -C $clean ls-files --eol -- project | Select-String '^i/lf\s+w/crlf')
          if ($converted.Count) { throw "Checked out with converted line endings: $($converted -join '; ')" }
          $env:SOURCE_DATE_EPOCH = '1609459200'
          uv build "$clean\project" --sdist --build-constraints "$clean\project\build-constraints.txt" --out-dir corresponding-sources
          Remove-Item Env:SOURCE_DATE_EPOCH
          Get-FileHash corresponding-sources\vellric-*.tar.gz -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower()) $(Split-Path $_.Path -Leaf)" } | Tee-Object measured\vellric-source-archive.txt
      - name: Install the bundle with no package index
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Expand-Archive (Get-Item dist\*.zip).FullName -DestinationPath bundle
          Get-Content bundle\INSTALL.txt
          python -m venv "$env:RUNNER_TEMP\vellric"
          Push-Location bundle
          # Offline proof: no cache to fall back on, and Git may use no transport.
          $env:GIT_ALLOW_PROTOCOL = 'none'
          & "$env:RUNNER_TEMP\vellric\Scripts\python.exe" -m pip install --no-cache-dir --no-index --require-hashes --no-deps -r requirements-wheels.txt
          Remove-Item Env:GIT_ALLOW_PROTOCOL
          & "$env:RUNNER_TEMP\vellric\Scripts\python.exe" -m pip check
          Pop-Location
          "VELLRIC=$env:RUNNER_TEMP\vellric\Scripts\vellric.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the bundle by name with no package index and no Git
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # The resolving form older bundles documented. Git may use no transport here, so a
          # bundled wheel that still names a Git source fails instead of cloning from GitHub. The
          # build step left Conric in pip's cache, which would satisfy that source without a clone.
          $env:GIT_ALLOW_PROTOCOL = 'none'
          $version = (Get-Item bundle\wheels\vellric-*.whl).Name.Split('-')[1]
          python -m venv "$env:RUNNER_TEMP\vellric-by-name"
          & "$env:RUNNER_TEMP\vellric-by-name\Scripts\python.exe" -m pip install --no-cache-dir --no-index --find-links bundle\wheels "vellric[ocr]==$version"
          & "$env:RUNNER_TEMP\vellric-by-name\Scripts\python.exe" -m pip check
          & "$env:RUNNER_TEMP\vellric-by-name\Scripts\vellric.exe" doctor
      - name: Run the installed tool with no OCR engines
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:VELLRIC doctor
          & $env:VELLRIC inspect project\tests\fixtures\Fake_Doc_watermarked.pdf --out "$env:RUNNER_TEMP\inspected" --status-json
          & $env:VELLRIC render project\tests\fixtures\Fake_Doc_watermarked.pdf --out "$env:RUNNER_TEMP\rendered" --status-json
      - name: Record exact bundle and installed native provenance
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:RUNNER_TEMP\vellric\Scripts\python.exe" ..\release-tools\bin\windows-release inventory --bundle (Get-Item dist\*.zip).FullName --source-root . --probe-native --output measured\windows-bundle-provenance.json
      - name: Install the OCR engines
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $installers = @(
            @{
              url = 'https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-5.5.3.20260724.exe'
              sha256 = 'bee9e3434bd94fd65387d9be28cd467a41f61b1275383b55b0f59a1331270ae4'
            },
            @{
              url = 'https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10071/gs10071w64.exe'
              sha256 = '3a4c28d0aac47aa7cccd35a5932c55110376e9dbd966898dde388b7faba444a4'
            }
          )
          foreach ($installer in $installers) {
            $file = Join-Path $env:RUNNER_TEMP (Split-Path $installer.url -Leaf)
            Invoke-WebRequest $installer.url -OutFile $file
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $installer.sha256) { throw "Digest mismatch: $file" }
            # Wait for the installer alone; a helper it leaves running must not hold the job.
            $run = Start-Process $file -ArgumentList '/S' -PassThru
            if (-not $run.WaitForExit(120000)) {
              # A silent installer that stops is showing a window nobody can answer here.
              Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table Id, ProcessName, MainWindowTitle -Wrap | Out-String | Write-Host
              $run.Kill($true)
              Write-Warning "Installer did not finish in two minutes: $file"
            } elseif ($run.ExitCode -ne 0) { throw "Installer failed with $($run.ExitCode): $file" }
          }
          $ghostscript = 'C:\Program Files\gs\gs10.07.1'
          if (-not (Test-Path "$ghostscript\bin\gswin64c.exe")) {
            # The same files the installer would place, unpacked to its default folder.
            7z x (Join-Path $env:RUNNER_TEMP 'gs10071w64.exe') "-o$ghostscript" -y | Select-Object -Last 3
          }
          foreach ($program in 'C:\Program Files\Tesseract-OCR\tesseract.exe', "$ghostscript\bin\gswin64c.exe") {
            if (-not (Test-Path $program)) { throw "Not installed: $program" }
          }
          & "$ghostscript\bin\gswin64c.exe" --version
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:VELLRIC doctor --json | Out-File measured\doctor.json -Encoding utf8
          Get-Content measured\doctor.json
          $engines = (Get-Content measured\doctor.json -Raw | ConvertFrom-Json).engines
          if ($engines.tesseract.version -ne 'tesseract v5.5.3.20260724') { throw "Tesseract: $($engines.tesseract.version)" }
          if ($engines.gs.version -ne '10.07.1') { throw "Ghostscript: $($engines.gs.version)" }
          if ($engines.ocrmypdf.version -ne '17.7.0') { throw "OCRmyPDF: $($engines.ocrmypdf.version)" }
      - name: Run the project tests with the engines present
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv sync --locked --project project --extra ocr --extra bedrock --python 3.13
          Set-Location project
          # With the engines present a skip would be the engines not found. Only tests that need a
          # POSIX facility Windows lacks may skip, each by its declared reason.
          uv run --no-sync python -X utf8 -m pytest -q -rs | Tee-Object -Variable report
          # Each "SKIPPED [n] path:line: reason" line passes only when its whole reason is one of these.
          $posixOnly = 'POSIX pass_fds', 'POSIX process groups', 'POSIX executable alias', 'Uses an executable fixture with a shebang'
          $skipped = @($report | Where-Object { $_ -like 'SKIPPED*' } | Where-Object {
            -not ($_ -match '^SKIPPED \[\d+\] .+?:\d+: (.*)$' -and $posixOnly -ccontains $Matches[1].TrimEnd())
          })
          if ($skipped.Count) { throw "A test was skipped with the engines installed: $($skipped -join '; ')" }
      - name: Convert the fixtures with the installed tool
        if: success() || failure()
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in 'Fake_Doc_watermarked', 'Fake_Math_Doc_watermarked') {
            & $env:VELLRIC convert "project\tests\fixtures\$name.pdf" --out "measured\$name" --ocr auto --status-json
          }
      - name: Assemble the source-closed release or candidate ZIP
        if: env.RELEASE_REF != '' || env.CANDIDATE != ''
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $python = "$env:RUNNER_TEMP\vellric\Scripts\python.exe"
          $tool = '..\release-tools\bin\windows-release'
          $closure = '..\release-tools\lib\windows-release-sources.json'
          & $python $tool fetch --closure $closure --directory corresponding-sources
          if ($env:RELEASE_REF) {
            $mode = '--tag', $env:RELEASE_REF
            $dist, $again = 'release-dist', 'release-reproduced'
            $asset, $repeat = 'windows-release-asset.json', 'windows-release-reproduction.json'
            $name = "vellric-$($env:RELEASE_REF.Substring(1))-windows-x64-py313.zip"
          } else {
            # Every check the release runs, under a name and report that say candidate.
            $mode = '--candidate', $env:CANDIDATE
            $dist, $again = 'candidate-dist', 'candidate-reproduced'
            $asset, $repeat = 'windows-candidate-asset.json', 'windows-candidate-reproduction.json'
            $name = "vellric-$env:CANDIDATE_VERSION-candidate-$($env:CANDIDATE.Substring(0, 12))-windows-x64-py313.zip"
          }
          New-Item -ItemType Directory $dist | Out-Null
          $zip = "$dist\$name"
          & $python $tool assemble --bundle (Get-Item dist\*.zip).FullName --source-root . --closure $closure --sources corresponding-sources --provenance measured\windows-bundle-provenance.json @mode --output $zip | Tee-Object "measured\$asset"
          New-Item -ItemType Directory $again | Out-Null
          $reproduced = "$again\$name"
          & $python $tool assemble --bundle (Get-Item dist\*.zip).FullName --source-root . --closure $closure --sources corresponding-sources --provenance measured\windows-bundle-provenance.json @mode --output $reproduced | Out-File "measured\$repeat" -Encoding utf8
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne (Get-FileHash $reproduced -Algorithm SHA256).Hash) { throw "Assembly of $name was not reproducible" }
          Expand-Archive $zip -DestinationPath released-bundle
          python -m venv "$env:RUNNER_TEMP\released-vellric"
          Push-Location released-bundle
          # Offline proof: no cache to fall back on, and Git may use no transport.
          $env:GIT_ALLOW_PROTOCOL = 'none'
          & "$env:RUNNER_TEMP\released-vellric\Scripts\python.exe" -m pip install --no-cache-dir --no-index --require-hashes --no-deps -r requirements-wheels.txt
          Remove-Item Env:GIT_ALLOW_PROTOCOL
          & "$env:RUNNER_TEMP\released-vellric\Scripts\python.exe" -m pip check
          Pop-Location
          $cli = "$env:RUNNER_TEMP\released-vellric\Scripts\vellric.exe"
          & $cli doctor --json | Out-File measured\released-doctor.json -Encoding utf8
          & $cli inspect project\tests\fixtures\Fake_Doc_watermarked.pdf --out "$env:RUNNER_TEMP\released-inspect" --status-json
          foreach ($name in 'Fake_Doc_watermarked', 'Fake_Math_Doc_watermarked') {
            & $cli convert "project\tests\fixtures\$name.pdf" --out "measured\released-$name" --ocr auto --local-only --status-json
          }
      - name: Retain only the qualified release ZIP
        if: success() && env.RELEASE_REF != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release-zip
          if-no-files-found: error
          path: source/release-dist/*.zip
      - name: Retain the qualified candidate ZIP, which is never a release asset
        if: success() && env.CANDIDATE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-candidate-zip
          if-no-files-found: error
          path: source/candidate-dist/*.zip
      - name: Keep the measured results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-measured
          path: source/measured
