name: Qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0 # Tags too: the release-version check reads them.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.9.26"
      - name: Build the qualified OCR engine
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool libleptonica-dev ghostscript qpdf
          curl -fsSL https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.2.tar.gz -o "$RUNNER_TEMP/tesseract.tar.gz"
          echo "6235ea0dae45ea137f59c09320406f5888383741924d98855bd2ce0d16b54f21  $RUNNER_TEMP/tesseract.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tesseract.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tesseract-5.5.2"
          ./autogen.sh
          ./configure --prefix="$RUNNER_TEMP/ocr" --disable-shared --enable-static --disable-openmp --disable-doc
          make -j4
          make install
          mkdir -p "$RUNNER_TEMP/ocr/share/tessdata"
          for language in eng osd; do
            curl -fsSL "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/$language.traineddata" -o "$RUNNER_TEMP/ocr/share/tessdata/$language.traineddata"
          done
          echo "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  $RUNNER_TEMP/ocr/share/tessdata/eng.traineddata" | sha256sum --check
          echo "9cf5d576fcc47564f11265841e5ca839001e7e6f38ff7f7aacf46d15a96b00ff  $RUNNER_TEMP/ocr/share/tessdata/osd.traineddata" | sha256sum --check
          echo "$RUNNER_TEMP/ocr/bin" >> "$GITHUB_PATH"
          echo "TESSDATA_PREFIX=$RUNNER_TEMP/ocr/share/tessdata" >> "$GITHUB_ENV"
      - name: Provision the locked project and hooks
        run: |
          ./bin/setup
          ./bin/install-hooks
          uv sync --locked --extra ocr --project project
          ln -s "$RUNNER_TEMP/ocr/bin/tesseract" project/.venv/bin/tesseract
      - name: Qualify the exact source tree
        run: ./bin/check all
      - name: Qualify a fresh installed wheel with native and OCR jobs
        env:
          SOURCE_DATE_EPOCH: "1609459200"
        run: |
          set -euo pipefail
          uv build project --wheel --python 3.12 --build-constraints project/build-constraints.txt --out-dir "$RUNNER_TEMP/release-wheels"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/release-installed" uv sync --locked --no-dev --extra ocr --no-install-project --project project --python 3.12
          uv pip install --python "$RUNNER_TEMP/release-installed/bin/python" --no-deps "$RUNNER_TEMP/release-wheels/"*.whl
          ln -s "$RUNNER_TEMP/ocr/bin/tesseract" "$RUNNER_TEMP/release-installed/bin/tesseract"
          mkdir -p .kickoff/check-all/installed-release
          "$RUNNER_TEMP/release-installed/bin/vellric" doctor --json > .kickoff/check-all/installed-release/doctor.json
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-installed/bin/vellric" convert "$GITHUB_WORKSPACE/project/tests/fixtures/Fake_Doc_watermarked.pdf" --out native --ocr never --preflight off --local-only --status-json > "$GITHUB_WORKSPACE/.kickoff/check-all/installed-release/native-status.json"
          "$RUNNER_TEMP/release-installed/bin/vellric" convert "$GITHUB_WORKSPACE/project/tests/fixtures/Fake_Doc_watermarked.pdf" --out ocr-document --ocr auto --preflight on --local-only --status-json > "$GITHUB_WORKSPACE/.kickoff/check-all/installed-release/ocr-document-status.json"
          "$RUNNER_TEMP/release-installed/bin/vellric" convert "$GITHUB_WORKSPACE/project/tests/fixtures/Fake_Math_Doc_watermarked.pdf" --out ocr-math --ocr auto --preflight on --local-only --status-json > "$GITHUB_WORKSPACE/.kickoff/check-all/installed-release/ocr-math-status.json"
          "$RUNNER_TEMP/release-installed/bin/python" - <<'PY'
          from pathlib import Path
          import hashlib, json, os, tomllib
          import vellric
          root = Path(os.environ["GITHUB_WORKSPACE"])
          evidence = root / ".kickoff/check-all/installed-release"
          assert not Path(vellric.__file__).resolve().is_relative_to(root / "project")
          doctor = json.loads((evidence / "doctor.json").read_text())
          expected_version = tomllib.loads((root / "project/pyproject.toml").read_text())["project"]["version"]
          assert doctor["tool"]["version"] == expected_version
          assert doctor["engines"]["tesseract"]["version"] == "tesseract 5.5.2"
          assert doctor["engines"]["ocrmypdf"]["version"] == "17.7.0"
          assert doctor["engines"]["pymupdf"]["version"] == "1.28.2"
          assert doctor["engines"]["gs"]["available"] and not doctor["missing_languages"]
          for status_name, fixture in [
              ("native-status.json", "Fake_Doc_watermarked.pdf"),
              ("ocr-document-status.json", "Fake_Doc_watermarked.pdf"),
              ("ocr-math-status.json", "Fake_Math_Doc_watermarked.pdf"),
          ]:
              status = json.loads((evidence / status_name).read_text())
              assert status["status"] == status["code"] == "complete"
              assert status["stage"] == "published" and status["page_count"] == 4
              assert status["source_sha256"] == hashlib.sha256((root / "project/tests/fixtures" / fixture).read_bytes()).hexdigest()
          PY
      - name: Retain gate receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-receipts
          path: .kickoff/check-all
