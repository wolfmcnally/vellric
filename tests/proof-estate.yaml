  contract: A project version already tagged on different project content refuses
    the gate.
  risk_class: release-identity
  oracle: The check's exit status against the live tags and project tree; the shallow-clone
    and missing-checkout cases refuse.
  admission: The owner ruled on 2026-10-15 that each version is bound to one commit;
    the gate refuses a tree whose version is tagged on different project content.
  nearest_overlap: The release-version pytest family proves the check's cases on synthetic
    repositories; this gate applies it to the live repository.
