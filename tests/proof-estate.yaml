  source_paths:
  - .githooks/pre-commit
  - project/packaging/release_version.py
  covers:
  - .githooks/pre-commit
  - project/packaging/release_version.py
  contract: A commit that changes a tagged version's project content without a new
    version is refused before it is recorded.
  risk_class: release-identity
  oracle: The check's exit status and refusal line against the index being committed
    and the live tags.
  admission: Independent review found that checking only the pushed tip lets an unbumped
    intermediate commit reach history; the owner ruled on 2026-10-15 that each version
    is bound to one commit.
  nearest_overlap: The staged-mode pytest proof covers the check on synthetic repositories;
    this hook applies it to every local commit.
