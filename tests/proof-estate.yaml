schema: agentic.proof_estate.v5
baseline_report: reports/test-governance/vellric-pre-reset-baseline.json
audit_ledger: reports/test-governance/vellric-reset.jsonl
witness_ledger: reports/test-governance/vellric-witnesses.jsonl
witness_failure_lines: ^E\s
adoption:
  mode: complete
hang_timeout_seconds: 1800
mutation:
  tool: cosmic-ray
  paths:
  - lib/agentic_starter/*.py
  - project/vellric/*.py
  budget_seconds: 300
critical_risks:
  custody:
    state: applicable
    direct_proof: pytest:project/tests/test_jobs.py::test_snapshot_hash_and_no_overwrite
  security:
    state: applicable
    direct_proof: pytest:project/tests/test_jobs.py::test_environment_excludes_credentials_and_injection
  authority:
    state: applicable
    direct_proof: pytest:tests/test_kickoff_evidence.py::test_change_manifest_is_candidate_bound_and_detects_authority_drift
  concurrency:
    state: applicable
    direct_proof: pytest:project/tests/test_jobs.py::test_exclusive_publication_race
  atomicity:
    state: applicable
    direct_proof: pytest:project/tests/test_jobs.py::test_exclusive_publication_race
  corruption:
    state: applicable
    direct_proof: pytest:project/tests/test_jobs.py::test_bundle_tampering_refused
  recovery:
    state: applicable
    direct_proof: pytest:project/tests/test_jobs.py::test_cancellation_reaps_worker_grandchild
  public-contract:
    state: applicable
    direct_proof: pytest:project/tests/test_jobs.py::test_native_full_job_and_golden
  schema:
    state: applicable
    direct_proof: pytest:project/tests/test_jobs.py::test_native_full_job_and_golden
  core-success:
    state: applicable
    direct_proof: pytest:project/tests/test_jobs.py::test_native_full_job_and_golden
  deploy:
    state: not-applicable
    rationale: Local implementation is not deployed or published; packaging is qualified
      locally.
    activation_trigger: Adding distribution/deployment commands requires direct deployment
      proofs.
families:
- id: pytest-tests-test_windows_release-py
  kind: pytest
  selectors:
  - tests/test_windows_release.py
  source_paths:
  - tests/test_windows_release.py
  covers:
  - bin/windows-release
  - lib/windows-release-sources.json
  - .github/workflows/windows.yml
  contract: An additional Windows release ZIP preserves exact wheel bytes and binds
    corresponding materials and native observations; incomplete or mismatched closure
    refuses output.
  risk_class: binary-release-provenance
  oracle: Independently read final ZIP bytes, compare original wheels and material
    bytes, and require explicit refusal without an output for invalid joins.
  admission: The pre-existing project bundle tests do not cover root-level source-closed
    release assembly or the public-retention boundary.
  nearest_overlap: Existing project builder tests prove raw wheelhouse composition,
    not native material and installed-probe joins.
  replacement_lineage: []
  tier: vital
  flake_rate: 0.0
- id: pytest-project-tests-test_citations-py
  kind: pytest
  selectors:
  - project/tests/test_citations.py
  source_paths:
  - project/tests/test_citations.py
  covers:
  - project/vellric/citations.py
  - project/vellric/runtime.py
  - project/vellric/worker.py
  - project/docs/PAGE-CITATIONS.md
  - project/docs/document.schema.json
  contract: Exact original PDF digest and physical ordinals produce standard anchors
    and a mandatory independently reconstructible citation mapping, without changing
    fidelity text or assigning PDF identity to raster images.
  risk_class: public-page-identity-and-schema
  oracle: Independent consumer string reconstruction, original text bytes, exact typed
    refusal boundaries, JSON schema and actual bounded renderer/sanitizer outputs.
  admission: New digest-bound citation metadata and HTML navigation output are not
    exercised by prior document success tests; negative tampering and hostile presentation
    cases distinguish authoritative identity from rendered hints. No production-only
    test seam is added.
  nearest_overlap: Existing job tests prove text and publication custody but do not
    enforce citation identity, image exclusions, canonical markup or renderer/sanitizer
    limitations.
  replacement_lineage: []
  tier: vital
  flake_rate: 0.0
- id: gate-changed
  kind: gate
  selectors:
  - changed
  source_paths:
  - bin/check
  covers:
  - bin/check
  contract: Destination-local changed executable contract.
  risk_class: scaffold-contract
  oracle: Named assertions and exact nonzero failure propagation.
  admission: Retain inherited boundary proof or current seed smoke test; do not claim
    PDF readiness. Initial observed failure count is zero; this is not a long-run
    flake-rate claim.
